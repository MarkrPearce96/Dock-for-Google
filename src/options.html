<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>App Launcher — Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main>
    <h1>App Launcher</h1>
    <p class="subtitle">Click an app in Available to add it. Hover a shortcut and click × to remove. Drag your shortcuts to reorder.</p>

    <div class="panels">
      <section class="panel">
        <div class="panel-head">
          <h2>Available</h2>
          <input id="search" type="search" placeholder="Search" autocomplete="off" />
        </div>
        <div id="available-grid" class="grid"></div>
        <p id="available-empty" class="empty" hidden></p>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>My shortcuts</h2>
        </div>
        <div id="my-grid" class="grid"></div>
        <p id="my-empty" class="empty" hidden>No shortcuts yet — add some from Available.</p>
        <div class="panel-actions">
          <button id="create-custom" type="button">Create custom shortcut</button>
          <button id="restore-defaults" class="secondary" type="button">Restore defaults</button>
        </div>
      </section>
    </div>

    <section class="card general">
      <h2>General</h2>
      <label class="toggle"><span>Open apps in a new tab</span><input id="pref-new-tab" type="checkbox" /></label>
      <label class="toggle"><span>Open in the background</span><input id="pref-background" type="checkbox" /></label>
      <label class="toggle"><span>Show the search box</span><input id="pref-search" type="checkbox" /></label>
      <label class="toggle"><span>Show app labels</span><input id="pref-labels" type="checkbox" /></label>
      <label class="toggle"><span>Theme</span>
        <select id="pref-theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="system">Follow system</option>
        </select>
      </label>
      <label class="toggle"><span>Columns (popup)</span>
        <select id="pref-columns">
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </label>
    </section>

    <section class="card">
      <h2>Backup &amp; restore</h2>
      <div class="backup-actions">
        <button id="export-backup" type="button">Export backup</button>
        <button id="import-backup" class="secondary" type="button">Import backup</button>
      </div>
      <p id="backup-status" class="status" hidden></p>
      <input id="import-file" type="file" accept="application/json,.json" hidden />
    </section>

    <dialog id="custom-dialog" class="modal">
      <form id="custom-form">
        <h2>Create custom shortcut</h2>
        <label>Shortcut name <input id="add-name" type="text" required /></label>
        <label>URL <input id="add-url" type="url" placeholder="https://example.com" required /></label>
        <label>Custom icon URL (optional) <input id="add-icon" type="url" placeholder="https://…/icon.png" /></label>
        <p id="add-error" class="error" hidden></p>
        <div class="form-actions">
          <button id="cancel-custom" class="secondary" type="button">Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
    </dialog>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
