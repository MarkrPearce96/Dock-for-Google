name: Build and release

# Version-tag pushes build automatically; manual dispatch can recover a missed run.
# Ordinary branch pushes never start a job.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build (for example v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No dependency cache: this project has no npm dependencies.

      - name: Validate version and reject existing releases before building
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const version = JSON.parse(readFileSync('package.json')).version;
          const manifest = JSON.parse(readFileSync('src/manifest.json'));
          if (!/^\d+\.\d+\.\d+$/.test(version) || manifest.version !== version) {
            throw new Error('package.json and manifest must have the same x.y.z version.');
          }
          const tag = `v${version}`;
          if (process.env.RELEASE_TAG !== tag) {
            throw new Error(`Release tag must match package and manifest version: ${tag}`);
          }
          const api = (...args) => JSON.parse(execFileSync('gh', ['api', ...args], { encoding: 'utf8' }));
          const repo = process.env.GH_REPO;
          let tagged = api(`repos/${repo}/git/ref/tags/${tag}`).object;
          while (tagged.type === 'tag') tagged = api(`repos/${repo}/git/tags/${tagged.sha}`).object;
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (tagged.type !== 'commit' || tagged.sha !== head) throw new Error('Checkout does not match the release tag.');
          const releases = api(`repos/${repo}/releases`, '--paginate', '--slurp').flat();
          if (releases.some(release => release.tag_name === tag)) {
            throw new Error(`${tag} already exists. Bump the version for a new release.`);
          }
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const section = changelog.split(`## ${version}\n`)[1]?.split('\n## ')[0]?.trim();
          if (!section) throw new Error(`Missing CHANGELOG.md entry for ${version}.`);
          writeFileSync(process.env.RUNNER_TEMP + '/release-notes.md', `${section}\n\nPersonal-use macOS 13+ app (Intel and Apple Silicon). Ad-hoc signed, not notarized. Enable unsigned extensions in Safari. Install via \`brew install --cask markrpearce96/tap/dock-for-google\`, or unzip and drag Dock for Google.app to Applications.\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          JS

      - name: Test, build, and verify zip
        run: npm run release

      - name: Record sha256 for the Homebrew Cask
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          SHA256=$(shasum -a 256 "dist/$RELEASE_TAG-zip/"*.zip | cut -d' ' -f1)
          echo "sha256: $SHA256" >> "$RUNNER_TEMP/release-notes.md"

      # Upload straight to Releases; no Actions artifacts or persistent caches.
      - name: Upload and publish GitHub release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/$RELEASE_TAG-zip/"*.zip \
            --verify-tag \
            --title "Dock for Google $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft
          gh release edit "$RELEASE_TAG" --draft=false
